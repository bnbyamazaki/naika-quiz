<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f0f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>内科専門医 一問一答</title>
  <style>
:root {
  --bg: #0f0f1e;
  --card: #1a1a2e;
  --card-hover: #22223a;
  --primary: #4cc9f0;
  --primary-dim: #1c5d77;
  --correct: #38b000;
  --wrong: #e63946;
  --text: #f1f1f1;
  --muted: #8d99ae;
  --border: #2a2a3e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: fadeIn 0.2s ease;
}

.screen.hidden { display: none; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* タイトル */
.title h1 {
  font-size: 26px;
  text-align: center;
  margin-top: 16px;
  line-height: 1.25;
  letter-spacing: 1px;
}

.title .subtitle {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 6px;
  letter-spacing: 2px;
}

/* カード */
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid var(--border);
}

.card h2 {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
  letter-spacing: 2px;
  font-weight: 600;
}

/* カテゴリ */
.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.category-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 10px 6px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  font-family: inherit;
}

.category-btn.active {
  background: var(--primary);
  color: var(--bg);
  border-color: var(--primary);
  font-weight: 600;
}

.category-btn.all {
  grid-column: span 2;
  background: var(--border);
  font-weight: 600;
}

.category-btn.all.active {
  background: var(--primary);
}

/* 出題数 */
.count-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.count-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 12px 4px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.count-btn.active {
  background: var(--primary);
  color: var(--bg);
  border-color: var(--primary);
  font-weight: 600;
}

/* プライマリボタン */
.primary-btn {
  background: var(--primary);
  color: var(--bg);
  border: none;
  padding: 16px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: auto;
  width: 100%;
  transition: transform 0.05s, opacity 0.15s;
  font-family: inherit;
}

.primary-btn:active {
  transform: scale(0.98);
}

.meta {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  margin-top: 8px;
  letter-spacing: 1px;
}

/* Quiz */
.quiz-header { padding: 4px 0 8px; }

.progress {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--primary);
  width: 0;
  transition: width 0.3s ease;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

.quiz-category {
  background: var(--primary-dim);
  padding: 2px 10px;
  border-radius: 10px;
  color: var(--primary);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.5px;
}

.quiz-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.question-card {
  background: var(--card);
  border-radius: 14px;
  padding: 20px;
  border: 1px solid var(--border);
  position: relative;
}

.question-id {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 10px;
  font-family: 'SF Mono', Monaco, monospace;
  letter-spacing: 0.5px;
}

.question-text {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.55;
}

.question-type {
  font-size: 10px;
  color: var(--primary);
  margin-top: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
}

/* 解答エリア */
.answer-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ○× */
.tf-statement {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 4px;
}

.tf-statement::before {
  content: "↳ ";
  color: var(--muted);
  margin-right: 4px;
}

.tf-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.tf-btn {
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 20px;
  border-radius: 14px;
  font-size: 36px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.05s, background 0.15s, border-color 0.15s;
  font-family: inherit;
}

.tf-btn:active { transform: scale(0.95); }
.tf-btn.maru { color: var(--correct); }
.tf-btn.batsu { color: var(--wrong); }

.tf-btn.correct {
  background: var(--correct);
  border-color: var(--correct);
  color: white;
}
.tf-btn.wrong {
  background: var(--wrong);
  border-color: var(--wrong);
  color: white;
}
.tf-btn:disabled { cursor: default; opacity: 0.85; }

/* 4択 */
.choice-btn {
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 14px 16px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  text-align: left;
  transition: transform 0.05s, background 0.15s, border-color 0.15s;
  line-height: 1.45;
  font-family: inherit;
}

.choice-btn:active { transform: scale(0.99); }

.choice-btn.correct {
  background: var(--correct);
  border-color: var(--correct);
  color: white;
}
.choice-btn.wrong {
  background: var(--wrong);
  border-color: var(--wrong);
  color: white;
}
.choice-btn:disabled { cursor: default; opacity: 0.85; }

/* フィードバック */
.feedback {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  border: 1px solid var(--border);
  margin-top: 4px;
  animation: fadeIn 0.2s ease;
}

.feedback.hidden { display: none; }

.feedback-result {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
}

.feedback-result.correct { color: var(--correct); }
.feedback-result.wrong { color: var(--wrong); }

.feedback-answer {
  font-size: 13.5px;
  line-height: 1.6;
  margin-bottom: 14px;
  color: var(--text);
}

.feedback-answer strong {
  color: var(--primary);
}

.feedback-answer .label {
  color: var(--muted);
  font-size: 11px;
  display: block;
  margin-bottom: 2px;
  letter-spacing: 0.5px;
}

/* 中断ボタン */
.quit-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  margin-top: 4px;
  font-family: inherit;
}

.quit-btn:active { background: var(--card); }

/* 結果 */
.result-summary {
  text-align: center;
  padding: 28px 16px;
}

.big-score {
  font-size: 44px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -1px;
}

.big-score #score-correct {
  color: var(--primary);
}

.big-score #score-total {
  color: var(--muted);
}

.score-rate {
  font-size: 22px;
  color: var(--text);
  font-weight: 600;
}

#category-stats {
  display: flex;
  flex-direction: column;
}

.cat-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.cat-stat:last-child {
  border-bottom: none;
}

.cat-stat .cat-name {
  color: var(--text);
}

.cat-stat .cat-score {
  font-weight: 600;
  color: var(--muted);
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 12px;
}

.cat-stat.good .cat-score { color: var(--correct); }
.cat-stat.poor .cat-score { color: var(--wrong); }

</style>
</head>

  <script>
// 内科専門医 一問一答アプリ
// データ: window.QB_DATA（data.js）

'use strict';

const State = {
  data: null,
  selectedCategories: new Set(),  // 空 = 全診療科
  selectedCount: 50,
  questions: [],
  currentIndex: 0,
  results: [],   // { item, type, userAnswer, correctAnswer, isCorrect }
};

const $ = (id) => document.getElementById(id);

// ─────────────────────────────────────────
// 起動
// ─────────────────────────────────────────
function init() {
  State.data = window.QB_DATA;
  if (!State.data || !State.data.items) {
    document.body.innerHTML = '<div style="padding:40px;color:#e63946;text-align:center;">データを読み込めませんでした。<br>data.js が存在するか確認してください。</div>';
    return;
  }
  $('data-version').textContent = `v${State.data.version} / ${State.data.total}問 / ${State.data.generated_at}`;
  buildCategoryButtons();
  bindEvents();
}

function buildCategoryButtons() {
  const container = $('categories-container');
  container.innerHTML = '';

  // 「全診療科」
  const allBtn = document.createElement('button');
  allBtn.className = 'category-btn all active';
  allBtn.textContent = `全診療科 (${State.data.total})`;
  allBtn.dataset.cat = '__all__';
  container.appendChild(allBtn);

  // 各カテゴリ
  for (const cat of State.data.categories) {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.dataset.cat = cat;
    const count = State.data.category_counts[cat];
    btn.textContent = `${cat} (${count})`;
    container.appendChild(btn);
  }
}

function bindEvents() {
  // カテゴリ
  $('categories-container').addEventListener('click', onCategoryClick);
  // 出題数
  $('count-container').addEventListener('click', onCountClick);
  // 開始
  $('start-btn').addEventListener('click', startQuiz);
  // 次へ
  $('next-btn').addEventListener('click', nextQuestion);
  // 中断
  $('quit-btn').addEventListener('click', () => {
    if (confirm('セッションを中断して最初に戻りますか?')) showScreen('start');
  });
  // もう一度
  $('restart-btn').addEventListener('click', () => showScreen('start'));
}

function onCategoryClick(e) {
  const btn = e.target.closest('.category-btn');
  if (!btn) return;
  const cat = btn.dataset.cat;
  if (cat === '__all__') {
    State.selectedCategories.clear();
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  } else {
    document.querySelector('.category-btn.all').classList.remove('active');
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      State.selectedCategories.add(cat);
    } else {
      State.selectedCategories.delete(cat);
    }
    if (State.selectedCategories.size === 0) {
      document.querySelector('.category-btn.all').classList.add('active');
    }
  }
}

function onCountClick(e) {
  const btn = e.target.closest('.count-btn');
  if (!btn) return;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  State.selectedCount = parseInt(btn.dataset.count, 10);
}

// ─────────────────────────────────────────
// セッション開始
// ─────────────────────────────────────────
function startQuiz() {
  let pool = State.data.items;
  if (State.selectedCategories.size > 0) {
    pool = pool.filter(item => State.selectedCategories.has(item.category));
  }
  if (pool.length === 0) {
    alert('該当する問題がありません');
    return;
  }

  const shuffled = shuffle([...pool]);
  const count = Math.min(State.selectedCount, shuffled.length);
  const selected = shuffled.slice(0, count);

  State.questions = selected.map(item => buildQuestion(item, State.data.items));
  State.currentIndex = 0;
  State.results = [];

  showScreen('quiz');
  renderQuestion();
}

// ─────────────────────────────────────────
// 出題生成
// ─────────────────────────────────────────
function buildQuestion(item, allItems) {
  const type = Math.random() < 0.5 ? 'tf' : '4ch';
  if (type === 'tf') return buildTF(item, allItems);
  return build4ch(item, allItems);
}

function buildTF(item, allItems) {
  const isTrue = Math.random() < 0.5;
  if (isTrue) {
    return {
      item,
      type: 'tf',
      statement: item.back,
      correctAnswer: '○',
    };
  }
  // 偽の文を作る: 同categoryの別back優先、なければ全体から
  let pool = allItems.filter(o => o.back !== item.back && o.category === item.category);
  if (pool.length === 0) {
    pool = allItems.filter(o => o.back !== item.back);
  }
  const fake = pool[Math.floor(Math.random() * pool.length)];
  return {
    item,
    type: 'tf',
    statement: fake.back,
    correctAnswer: '×',
  };
}

function build4ch(item, allItems) {
  let pool = allItems.filter(o => o.back !== item.back && o.category === item.category);
  if (pool.length < 3) {
    const extras = allItems.filter(o => o.back !== item.back && o.category !== item.category);
    pool = pool.concat(shuffle(extras).slice(0, 3 - pool.length));
  }
  const distractors = shuffle(pool).slice(0, 3).map(o => o.back);
  const choices = shuffle([item.back, ...distractors]);
  return {
    item,
    type: '4ch',
    choices,
    correctAnswer: item.back,
  };
}

// ─────────────────────────────────────────
// 問題描画
// ─────────────────────────────────────────
function renderQuestion() {
  const q = State.questions[State.currentIndex];
  const total = State.questions.length;

  $('progress-current').textContent = State.currentIndex + 1;
  $('progress-total').textContent = total;
  $('progress-bar').style.width = `${(State.currentIndex / total) * 100}%`;
  $('quiz-category').textContent = q.item.category;

  $('question-id').textContent = q.item.id;
  $('question-text').textContent = q.item.front;
  $('question-type').textContent = q.type === 'tf' ? '○ × 問題' : '4択問題';

  const area = $('answer-area');
  area.innerHTML = '';
  $('feedback').classList.add('hidden');

  if (q.type === 'tf') {
    renderTF(q, area);
  } else {
    render4ch(q, area);
  }
}

function renderTF(q, area) {
  const statement = document.createElement('div');
  statement.className = 'tf-statement';
  statement.textContent = q.statement;
  area.appendChild(statement);

  const btnWrap = document.createElement('div');
  btnWrap.className = 'tf-buttons';

  const maru = document.createElement('button');
  maru.className = 'tf-btn maru';
  maru.textContent = '○';
  maru.dataset.answer = '○';

  const batsu = document.createElement('button');
  batsu.className = 'tf-btn batsu';
  batsu.textContent = '×';
  batsu.dataset.answer = '×';

  btnWrap.appendChild(maru);
  btnWrap.appendChild(batsu);
  area.appendChild(btnWrap);

  btnWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.tf-btn');
    if (!btn || btn.disabled) return;
    handleAnswer(btn.dataset.answer);
  });
}

function render4ch(q, area) {
  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.dataset.answer = choice;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      handleAnswer(choice);
    });
    area.appendChild(btn);
  });
}

// ─────────────────────────────────────────
// 解答処理
// ─────────────────────────────────────────
function handleAnswer(userAnswer) {
  // 二重解答防止：同じ問題ですでに回答済みなら無視
  if (State.results.length > State.currentIndex) return;
  const q = State.questions[State.currentIndex];
  if (!q) return;
  const isCorrect = userAnswer === q.correctAnswer;

  State.results.push({
    item: q.item,
    type: q.type,
    userAnswer,
    correctAnswer: q.correctAnswer,
    isCorrect,
  });

  // ボタンを無効化＋色付け
  document.querySelectorAll('.tf-btn, .choice-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.answer === q.correctAnswer) {
      btn.classList.add('correct');
    } else if (btn.dataset.answer === userAnswer && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  showFeedback(q, isCorrect);
}

function showFeedback(q, isCorrect) {
  const fb = $('feedback');
  fb.classList.remove('hidden');

  const result = $('feedback-result');
  result.textContent = isCorrect ? '✓ 正解' : '✗ 不正解';
  result.className = `feedback-result ${isCorrect ? 'correct' : 'wrong'}`;

  const ans = $('feedback-answer');
  if (q.type === 'tf') {
    if (q.correctAnswer === '○') {
      ans.innerHTML = `<span class="label">この組み合わせは正しい</span><strong>${esc(q.item.front)}</strong><br>→ ${esc(q.item.back)}`;
    } else {
      ans.innerHTML = `<span class="label">本来の正解</span>${esc(q.item.front)}<br>→ <strong>${esc(q.item.back)}</strong><br><span class="label" style="margin-top:8px;">提示された文は別の問題の答え</span>`;
    }
  } else {
    ans.innerHTML = `<span class="label">正解</span><strong>${esc(q.correctAnswer)}</strong>`;
  }
  // スクロールで「次へ」を見せる
  fb.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ─────────────────────────────────────────
// 次へ / 結果
// ─────────────────────────────────────────
function nextQuestion() {
  // 結果画面表示中の二重進行防止
  if (State.currentIndex >= State.questions.length) return;
  State.currentIndex++;
  if (State.currentIndex >= State.questions.length) {
    showResult();
  } else {
    renderQuestion();
    // 画面を上にスクロール
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResult() {
  showScreen('result');

  const correctCount = State.results.filter(r => r.isCorrect).length;
  const total = State.results.length;
  const rate = total === 0 ? 0 : Math.round((correctCount / total) * 100);

  $('score-correct').textContent = correctCount;
  $('score-total').textContent = total;
  $('score-rate').textContent = `${rate}%`;

  // 診療科別
  const catMap = {};
  for (const r of State.results) {
    const c = r.item.category;
    if (!catMap[c]) catMap[c] = { correct: 0, total: 0 };
    catMap[c].total++;
    if (r.isCorrect) catMap[c].correct++;
  }

  const statsEl = $('category-stats');
  statsEl.innerHTML = '';
  const entries = Object.entries(catMap).sort((a, b) => (b[1].correct / b[1].total) - (a[1].correct / a[1].total));
  for (const [cat, s] of entries) {
    const rate = Math.round((s.correct / s.total) * 100);
    const el = document.createElement('div');
    el.className = `cat-stat ${rate >= 80 ? 'good' : rate < 60 ? 'poor' : ''}`;
    el.innerHTML = `<span class="cat-name">${esc(cat)}</span><span class="cat-score">${s.correct}/${s.total} · ${rate}%</span>`;
    statsEl.appendChild(el);
  }
}

// ─────────────────────────────────────────
// 画面切替・ユーティリティ
// ─────────────────────────────────────────
function showScreen(name) {
  ['start', 'quiz', 'result'].forEach(s => {
    $(`screen-${s}`).classList.toggle('hidden', s !== name);
  });
  window.scrollTo({ top: 0 });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 起動
window.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
